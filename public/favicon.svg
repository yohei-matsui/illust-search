<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景グラデーション（やや暗め） -->
    <linearGradient id="bgGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <!-- ボタン面グラデーション（中央が明るい） -->
    <radialGradient id="btnGrad" cx="42%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#6a6a6a"/>
      <stop offset="60%" style="stop-color:#4a4a4a"/>
      <stop offset="100%" style="stop-color:#2e2e2e"/>
    </radialGradient>
    <!-- ハイライト（ボタン上部の光沢） -->
    <radialGradient id="shine" cx="38%" cy="25%" r="55%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <!-- 中央ドット（押すポイント） -->
    <radialGradient id="dotGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:0.85"/>
    </radialGradient>
    <!-- ドロップシャドウ -->
    <filter id="outerShadow" x="-12%" y="-8%" width="124%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- ボタンの押し込み感（内側シャドウっぽく） -->
    <filter id="btnShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- リング用フィルタ -->
    <filter id="ringShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ===== 外枠（丸角四角） ===== -->
  <!-- 奥行き感のためのレイヤー -->
  <rect x="36" y="44" width="440" height="440" rx="98" fill="#0a0a0a" opacity="0.5"/>
  <!-- メイン背景 -->
  <rect x="22" y="22" width="468" height="468" rx="100" fill="url(#bgGrad)" filter="url(#outerShadow)"/>

  <!-- ===== ボタンのベースリング（立体感） ===== -->
  <!-- 外リング（暗め）：押し込みの縁 -->
  <circle cx="256" cy="262" r="164" fill="#111111" filter="url(#ringShadow)"/>
  <!-- 内リング（少し明るい縁） -->
  <circle cx="256" cy="256" r="160" fill="#2c2c2c"/>

  <!-- ===== ボタン本体 ===== -->
  <circle cx="256" cy="252" r="138" fill="url(#btnGrad)" filter="url(#btnShadow)"/>
  <!-- 光沢ハイライト -->
  <circle cx="256" cy="252" r="138" fill="url(#shine)"/>

  <!-- ===== 中央の「ポチ」ドット ===== -->
  <!-- 外リング（白い枠） -->
  <circle cx="256" cy="252" r="46" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <!-- ドット本体 -->
  <circle cx="256" cy="252" r="38" fill="url(#dotGrad)"/>
  <!-- ドットハイライト -->
  <circle cx="243" cy="239" r="10" fill="rgba(255,255,255,0.4)"/>

  <!-- ===== 外枠の光沢ライン（上辺） ===== -->
  <rect x="22" y="22" width="468" height="468" rx="100"
    fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
</svg>
